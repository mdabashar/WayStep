name: Deploy Waystep to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate app and MCP server
        run: |
          npm ci
          node --check dist/app.js
          node --check dist/example-plan.js
          node --check dist/ai.js
          node --check dist/features.js
          node --check dist/sw.js
          npm test
          npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Build site
        env:
          WAYSTEP_FIREBASE_CONFIG: ${{ vars.WAYSTEP_FIREBASE_CONFIG }}
          WAYSTEP_MCP_URL: ${{ vars.WAYSTEP_MCP_URL }}
        run: |
          npm ci
          npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
